version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: docuaudit
      POSTGRES_USER: docuaudit
      POSTGRES_PASSWORD: docuaudit
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  backend:
    build: ./backend
    depends_on: [postgres, redis, qdrant]
    ports: ["8000:8000"]
    env_file: .env
    volumes:
      - ./data/uploads:/app/data/uploads

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    depends_on: [redis, postgres]
    env_file: .env
    volumes:
      - ./data/uploads:/app/data/uploads

volumes:
  pgdata:
  qdrant_data:
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: docuaudit
      POSTGRES_USER: docuaudit
      POSTGRES_PASSWORD: docuaudit
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuaudit -d docuaudit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    ports: ["8000:8000"]
    environment: &app-env
      DATABASE_URL: postgresql+psycopg2://docuaudit:docuaudit@postgres:5432/docuaudit
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - ./data/uploads:/app/data/uploads
      - hf_cache:/root/.cache/huggingface

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=solo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    environment: *app-env
    volumes:
      - ./data/uploads:/app/data/uploads
      - hf_cache:/root/.cache/huggingface

volumes:
  pgdata:
  qdrant_data:
  hf_cache: